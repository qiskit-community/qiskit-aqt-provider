name: Test

on:
  push:
    branches: [v2-migration]
  pull_request:
    branches: [v2-migration]

env:
  PYTHONUTF8: 1
  UV_VERSION: ${{ vars.UV_VERSION }}
  TARGET_PYTHON: ${{ vars.TARGET_PYTHON }}

jobs:
  validate:
    name: validate workflow variables
    runs-on: ubuntu-latest
    steps:
      - name: Validate required workflow variables
        run: |
          test -n "${UV_VERSION}" || { echo "UV_VERSION is not set"; exit 1; }
          test -n "${TARGET_PYTHON}" || { echo "TARGET_PYTHON is not set"; exit 1; }

  test:
    name: test-python${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: validate

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Check lock file status
        run: uv lock --check

      - name: Install all dependencies
        run: uv sync --all-groups --extra test

      - name: Check pyproject.toml formatting
        run: mise run check:pyproject

      - name: Linting
        run: mise run check:linting

      - name: Spellchecking
        run: mise run check:spelling

      - name: Check formatting
        run: mise run check:format

      - name: Typecheck
        run: mise run check:types

      - name: Unit tests
        run: mise run test:unit -- --doctest-modules --junitxml=junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml

      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml
        if: ${{ always() }}

  integration_check:
    name: integration-check
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' && github.ref == 'refs/heads/v2-migration' }}
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes requiring integration testing
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            qiskit_aqt_provider/**
            test/integration/**

  integration_test:
    name: integration-test
    runs-on: ubuntu-latest
    needs: integration_check
    if: ${{ needs.integration_check.outputs.any_changed == 'true' && github.ref == 'refs/heads/v2-migration' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.TARGET_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.TARGET_PYTHON }}

      - name: Install uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install all dependencies
        run: uv sync --all-groups --extra test

      - name: Run integration tests upon changes
        run: mise run test:integration
