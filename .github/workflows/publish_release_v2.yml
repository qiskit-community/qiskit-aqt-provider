name: Release V2

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [v2-migration]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1
  UV_VERSION: ${{ vars.UV_VERSION }}
  TARGET_PYTHON: ${{ vars.TARGET_PYTHON }}

jobs:
  build:
    name: build release distributions
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python ${{ env.TARGET_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.TARGET_PYTHON }}

      - name: Install uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install all dependencies
        run: uv sync --all-groups --extra test

      - name: Build release distributions
        run: mise run build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  acceptance:
    name: test release distributions
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python ${{ env.TARGET_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.TARGET_PYTHON }}

      - name: Install uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install test dependencies
        run: uv sync --group lint --extra test --no-install-project

      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Install release distribution
        shell: bash
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install dist/*.whl

      - name: Run acceptance tests
        run: mise run test:acceptance

  preflight:
    name: release preflight
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    needs: acceptance
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      should_publish: ${{ steps.pypi.outputs.should_publish }}
      should_create_release: ${{ steps.github-release.outputs.should_create_release }}
    steps:
      - name: Validate required workflow variables
        run: |
          test -n "${UV_VERSION}" || { echo "UV_VERSION is not set"; exit 1; }
          test -n "${TARGET_PYTHON}" || { echo "TARGET_PYTHON is not set"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python ${{ env.TARGET_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.TARGET_PYTHON }}

      - name: Install uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install changelog dependencies
        run: uv sync --group lint --no-install-project

      - name: Read release version
        id: metadata
        shell: bash
        run: |
          version="$(python - <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          if not re.fullmatch(r"2\.\d+\.\d+(?:(?:a|b|rc)\d+)?(?:\.post\d+)?(?:\.dev\d+)?", version):
              print(f"Expected a 2.x.x version on v2-migration, found {version}.", file=sys.stderr)
              sys.exit(1)
          print(version)
          PY
          )"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Extract release changelog
        run: uv run python scripts/extract-changelog.py "${{ steps.metadata.outputs.tag }}" > RELEASE_CHANGELOG.txt

      - name: Check if version should be published to PyPI
        id: pypi
        shell: bash
        run: |
          version="${{ steps.metadata.outputs.version }}"
          http_status="$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/qiskit-aqt-provider/${version}/json")"

          if [ "${http_status}" = "200" ]; then
            echo "::notice::Version ${version} is already published on PyPI. Skipping PyPI publish."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          elif [ "${http_status}" = "404" ]; then
            echo "Version ${version} is not yet on PyPI. Proceeding with publish."
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Unexpected HTTP status ${http_status} when checking PyPI for version ${version}."
            exit 1
          fi

      - name: Check if GitHub release can be created
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.metadata.outputs.tag }}"

          remote_tag="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [ -n "${remote_tag}" ]; then
            if gh release view "${tag}" > /dev/null 2>&1; then
              echo "::notice::GitHub release ${tag} already exists. Skipping GitHub release creation."
              echo "should_create_release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "::error::Tag ${tag} already exists, but GitHub release ${tag} does not."
            exit 1
          fi

          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "::error::GitHub release ${tag} already exists, but tag ${tag} does not."
            exit 1
          fi

          echo "should_create_release=true" >> "${GITHUB_OUTPUT}"

      - name: Upload release changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: RELEASE_CHANGELOG.txt

  release:
    name: publish release
    if: >
      needs.preflight.outputs.should_publish == 'true' ||
      needs.preflight.outputs.should_create_release == 'true'
    runs-on: ubuntu-latest
    environment: release-v2
    needs: [preflight, acceptance]
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download release distributions
        if: needs.preflight.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Download release changelog
        if: needs.preflight.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-changelog

      - name: Publish to PyPI
        if: needs.preflight.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create git tag and GitHub release
        if: needs.preflight.outputs.should_create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.preflight.outputs.tag }}"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

          gh release create "${tag}" \
            --title "${tag}" \
            --notes-file RELEASE_CHANGELOG.txt \
            dist/*

  docs:
    name: deploy documentation
    if: ${{ needs.preflight.outputs.should_create_release == 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [preflight, acceptance, release]
    permissions:
      contents: write
    env:
      DOCS_DEFAULT_VERSION: ${{ vars.DOCS_DEFAULT_VERSION }}
      DOCS_VERSION_PATH: v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python ${{ env.TARGET_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.TARGET_PYTHON }}

      - name: Install uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install all dependencies
        run: uv sync --all-groups --extra test

      - name: Build documentation
        run: mise run docs

      - name: Publish versioned docs to gh-pages
        shell: bash
        run: |
          : "${DOCS_DEFAULT_VERSION:?Set repository variable DOCS_DEFAULT_VERSION}"

          remote_url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="$(mktemp -d)"

          git init "${workdir}"
          cd "${workdir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads "${remote_url}" gh-pages > /dev/null 2>&1; then
            git fetch --depth=1 "${remote_url}" gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi

          rm -rf "${DOCS_VERSION_PATH}"
          mkdir -p "${DOCS_VERSION_PATH}"
          cp -a "${GITHUB_WORKSPACE}/docs/_build/." "${DOCS_VERSION_PATH}/"

          cat > index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./${DOCS_DEFAULT_VERSION}/">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="canonical" href="./${DOCS_DEFAULT_VERSION}/">
            <title>Qiskit AQT Provider documentation</title>
            <script>
              window.location.replace("./${DOCS_DEFAULT_VERSION}/");
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="./${DOCS_DEFAULT_VERSION}/">default documentation</a>.</p>
          </body>
          </html>
          EOF

          touch .nojekyll
          git add --all
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi

          git commit -m "Deploy ${DOCS_VERSION_PATH} docs for ${{ needs.preflight.outputs.tag }}"
          git push "${remote_url}" gh-pages
